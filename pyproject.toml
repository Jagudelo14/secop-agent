# Descripción: Dependencias y configuración del agente analista de SECOP II

[project]
name = "secop-agent"
version = "1.0.0"
description = "Agente que responde preguntas sobre contratos públicos de SECOP II y marca patrones para revisar"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
# tope en la siguiente versión mayor: mcp_server usa una API interna del SDK mcp
dependencies = [
    "anthropic>=1.0,<3",
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "mcp>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "google-genai>=3.3.0,<4",
]

[project.optional-dependencies]
demo = ["streamlit>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.scripts]
secop-agent = "secop_agent.__main__:main"
secop-mcp = "secop_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
