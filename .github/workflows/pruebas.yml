# Descripción: Corre las pruebas sin red en cada push y pull request

name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # mismas versiones del uv.lock
      - run: uv sync --locked --extra demo
      - run: uv run pytest -q
